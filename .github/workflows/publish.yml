name: Publish mod

on:
  push:
    branches:
      - 'versions/*.*'
  workflow_dispatch:

env:
  JAVA_VERSION: 21

permissions:
  contents: write
  
jobs:
  build-and-publish:
    if: contains(github.ref_name, 'versions/') # Is version branch
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Publish
        env:
          GITHUB_PACKAGE_TOKEN: ${{ secrets.PACKAGE_GITHUB_TOKEN }}
        run: |
          ./gradlew :fabric:publish
          ./gradlew :neoforge:publish
