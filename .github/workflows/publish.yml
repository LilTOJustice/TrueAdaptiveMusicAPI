name: Publish mod

on:
  push:
    branches:
      - 'versions/*.*'
  workflow_dispatch:

env:
  JAVA_VERSION: 21

permissions:
  contents: write
  
jobs:
  determine-versions:
    runs-on: ubuntu-latest
    outputs:
      minecraft_version: ${{ steps.minecraft.outputs.minecraft_version }}
      mod_version: ${{ steps.mod.outputs.mod_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
      - id: minecraft
        name: Get minecraft version
        run: |
          grep 'minecraft_version=.*' gradle.properties >> "$GITHUB_OUTPUT"
      - id: mod
        name: Get mod version
        run: |
          grep 'mod_version=.*' gradle.properties >> "$GITHUB_OUTPUT"
  build-and-publish:
    if: contains(github.ref_name, 'versions/') # Is version branch
    runs-on: ubuntu-latest
    needs: determine-versions
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
